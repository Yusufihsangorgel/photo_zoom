  <text x="435.0" y="426.0" fill="#d8dee9" font-size="12.5" font-family="Menlo, monospace" text-anchor="middle">the same gesture; the photo decides only whether it has anything left to do with it</text>
  <text x="435.0" y="446.0" fill="#8b93a3" font-size="11" font-family="Menlo, monospace" text-anchor="middle">always claiming it traps the reader in the post; never claiming it means no zoom on a desktop</text>
