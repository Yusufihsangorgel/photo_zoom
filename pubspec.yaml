name: photo_zoom
description: >-
  Pan, zoom, rotate and swipe a photo gallery. Double tap and pinch zoom where
  you touch; mouse wheel on desktop. A type-safe, maintained alternative to
  photo_view.
version: 1.2.2
repository: https://github.com/Yusufihsangorgel/photo_zoom
issue_tracker: https://github.com/Yusufihsangorgel/photo_zoom/issues

topics:
  - image
  - zoom
  - gallery
  - viewer
  - gestures

screenshots:
  - description: >-
      A double tap, a drag and a two-finger pinch on a numbered grid. The
      tile under the marker is the same tile throughout.
    path: doc/anchored-zoom.gif
  - description: >-
      The same image at contained, covered and 1.0, so the two computed scales
      the API is written against are visible rather than described.
    path: doc/scale-states.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
