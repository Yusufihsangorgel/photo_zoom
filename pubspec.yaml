name: photo_zoom
description: "Flutter photo gallery and image viewer with pinch zoom, pan, rotation, double-tap zoom and desktop mouse-wheel control. An alternative to photo_view."
version: 1.2.4
repository: https://github.com/Yusufihsangorgel/photo_zoom
issue_tracker: https://github.com/Yusufihsangorgel/photo_zoom/issues

topics:
  - pinch-zoom
  - photo-gallery
  - image-viewer
  - double-tap-zoom
  - mouse-wheel

screenshots:
  - description: >-
      A double tap, a drag and a two-finger pinch on a numbered grid. The
      tile under the marker is the same tile throughout.
    path: doc/anchored-zoom.gif
  - description: >-
      The same image at contained, covered and 1.0, so the two computed scales
      the API is written against are visible rather than described.
    path: doc/scale-states.png

  - description: >-
      Where a mouse wheel goes when a photo sits in a feed: to the photo while
      it can still zoom, and to the feed once it cannot.
    path: doc/wheel-handoff.png
environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
